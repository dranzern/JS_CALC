<!DOCTYPE html>
<html>
    <head>
        <title>Catalogo De Peliculas</title>
        <link rel="stylesheet" href="misEstilos.css">
        <script src="miScript.js"></script>
    </head>
    <body>
        <h1>Bienvenido al cine &#127909; !</h1>
        <h4>--Catalogo</h4>
        <p>Queremos hacer de tu visita, una experiencia mas placentera.
            Para eso ingresa tu edad y selecciona el genero que mas te guste
            ,y te recomendamos la pelicula ideal.
        </p>
        <p>Edad:<input type="number" min="1" id="ingresarEdad"></p>
        <br><br>
        <div>
            <button onclick="recomendar('comedia')">Comedia</button>
            <button onclick="recomendar('drama')">Drama</button>
            <button onclick="recomendar('musical')">Musical</button>
            <button onclick="recomendar('crimen')">Crimen</button>
        </div>
        <h2>Tu pelicula ideal es :</h2>
        <h3 id="mostrarPelicula"></h3>
    </body>
</html>
